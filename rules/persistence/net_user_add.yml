title: net user ilə yeni lokal istifadəçinin yaradılması
id: 27a921da-c95c-4e09-826c-44fd8b0fdf8a
status: test
description: net.exe və net1.exe-nin /add parametri ilə yeni lokal istifadəçi hesabı yaradılmasını aşkarlayır, bu qalıcılıq üçün istifadə olunur.
author: Miri
date: '2026-10-28'
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|re:
      - '.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]'
      - '.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]'
  selection_cli_1:
    CommandLine|re: '.* [Uu][Ss][Ee][Rr] .*'
  selection_cli_2:
    CommandLine|re: '.* /[Aa][Dd][Dd].*'
  condition: selection_img and (selection_cli_1 and selection_cli_2)
falsepositives:
  - Administratorların və ya quraşdırma skriptlərinin istifadəçi yaratması
level: high
