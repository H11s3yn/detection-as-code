title: schtasks ilə yeni planlaşdırılmış tapşırığın yaradılması
id: 18957f0b-d0fe-4dd6-944e-5a887b448ae2
status: test
description: schtasks.exe-nin /create parametri ilə yeni planlaşdırılmış tapşırıq yaratmasını aşkarlayır, bu qalıcılıq üçün tez-tez istifadə olunur.
author: Miri
date: '2026-10-27'
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_cli:
    CommandLine|contains: ' /create '
  condition: selection_img and selection_cli
falsepositives:
  - Proqram quraşdırıcıları və administratorların legitim planlaşdırılmış tapşırıqları
level: medium