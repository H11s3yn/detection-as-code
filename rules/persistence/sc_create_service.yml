title: sc ilə yeni Windows xidmətinin yaradılması
id: d98c99d6-a392-41b1-bc2f-be91c1e5a3c7
status: test
description: sc.exe-nin create parametri ilə yeni Windows xidməti yaratmasını aşkarlayır, bu qalıcılıq üçün istifadə olunur.
author: Miri
date: '2026-10-27'
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\sc.exe'
  selection_cli:
    CommandLine|contains: ' create '
  condition: selection_img and selection_cli
falsepositives:
  - Proqram quraşdırıcıları və administratorların legitim xidmət yaratması
level: medium