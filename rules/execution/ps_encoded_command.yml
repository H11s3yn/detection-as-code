title: Base64 ilə kodlanmış PowerShell əmri
id: 5c9910ce-3752-4c9e-a397-90535229cbc3
status: test
description: PowerShell-in -EncodedCommand ilə işə salınmasını aşkarlayır.
author: Miri
date: '2026-10-26'
modified: '2026-11-20'
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\POWERSHELL.EXE'
  selection_cli:
    CommandLine|contains:
      - ' -e '
      - ' -ec '
      - ' -en '
      - ' -enc '
      - ' -ENC '
      - ' -EncodedCommand '
      - ' -ENCODEDCOMMAND '
  selection_orig:
    OriginalFileName:
      - 'powershell.exe'
  condition: (selection_img or selection_orig) and selection_cli
falsepositives:
  - Bəzi legitim idarəetmə skriptləri
level: medium