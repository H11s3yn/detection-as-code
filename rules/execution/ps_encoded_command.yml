title: Base64 ilə kodlanmış PowerShell əmri
id: 5c9910ce-3752-4c9e-a397-90535229cbc3
status: test
description: PowerShell-in -EncodedCommand ilə işə salınmasını aşkarlayır.
author: Miri
date: '2026-10-26'
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|re: '.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]'
  selection_cli:
    CommandLine|re:
      - '.* -[Ee][Nn][Cc] .*'
      - '.* -[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd] .*'
  condition: selection_img and selection_cli
falsepositives:
  - Bəzi legitim idarəetmə skriptləri
level: medium