title: WMIC ilə proses yaradılması
id: 848f6a28-a108-412b-be6a-2b710d6981e7
status: test
description: wmic.exe vasitəsilə "process call create" əmri ilə yeni proses başladılmasını aşkarlayır.
author: Miri
date: '2026-10-27'
tags:
  - attack.execution
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|re: '.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]'
  selection_cli_1:
    CommandLine|re: '.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*'
  selection_cli_2:
    CommandLine|re: '.*[Cc][Aa][Ll][Ll].*'
  selection_cli_3:
    CommandLine|re: '.*[Cc][Rr][Ee][Aa][Tt][Ee].*'
  condition: selection_img and (selection_cli_1 and selection_cli_2 and selection_cli_3)
falsepositives:
  - Bəzi legitim idarəetmə və inventar skriptləri
level: medium