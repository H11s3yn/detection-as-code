title: WMIC ilə proses yaradılması
id: 848f6a28-a108-412b-be6a-2b710d6981e7
status: test
description: wmic.exe vasitəsilə "process call create" əmri ilə yeni proses başladılmasını aşkarlayır.
author: Miri
date: '2026-10-27'
tags:
  - attack.execution
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\wmic.exe'
      - '\WMIC.exe'
  selection_cli_lower:
    CommandLine|contains|all:
      - 'process'
      - 'call'
      - 'create'
  selection_cli_upper:
    CommandLine|contains|all:
      - 'PROCESS'
      - 'CALL'
      - 'CREATE'
  condition: selection_img and (selection_cli_lower or selection_cli_upper)
falsepositives:
  - Bəzi legitim idarəetmə və inventar skriptləri
level: medium