title: WMIC ilə proses yaradılması
id: 848f6a28-a108-412b-be6a-2b710d6981e7
status: test
description: wmic.exe vasitəsilə "process call create" əmri ilə yeni proses başladılmasını aşkarlayır.
author: Miri
date: '2026-10-27'
tags:
  - attack.execution
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\wmic.exe'
  selection_cli:
    CommandLine|contains|all:
      - 'process'
      - 'call'
      - 'create'
  condition: selection_img and selection_cli
falsepositives:
  - Bəzi legitim idarəetmə və inventar skriptləri
level: medium