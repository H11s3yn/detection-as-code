title: Office proqramından cmd və ya PowerShell başladılması
id: c94a68fa-4704-4660-babd-f67c484b4afe
status: test
description: Word, Excel və ya PowerPoint prosesinin cmd.exe, powershell.exe və ya pwsh.exe başlatmasını aşkarlayır, bu zərərli makro üçün tipik əlamətdir.
author: Miri
date: '2026-10-27'
tags:
  - attack.execution
  - attack.t1204.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|re:
      - '.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]'
      - '.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]'
      - '.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]'
  selection_child:
    Image|re:
      - '.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]'
      - '.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]'
      - '.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]'
  condition: selection_parent and selection_child
falsepositives:
  - Makrolarla işləyən legitim biznes skriptləri və add-in-lər
level: high