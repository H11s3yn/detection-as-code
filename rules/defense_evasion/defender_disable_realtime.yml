title: Windows Defender real vaxt qorumasının söndürülməsi
id: 4a329481-348a-46b4-9cc7-7f530875e17d
status: test
description: PowerShell ilə Set-MpPreference vasitəsilə Defender-in real vaxt qorumasının söndürülməsini aşkarlayır.
author: Miri
date: '2026-10-27'
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|re:
      - '.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]'
      - '.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]'
  selection_cmd:
    CommandLine|re: '.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*'
  selection_disable:
    CommandLine|re: '.*-[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*'
  condition: selection_img and selection_cmd and selection_disable
falsepositives:
  - Administratorların test və ya quraşdırma zamanı Defender-i müvəqqəti söndürməsi
level: high