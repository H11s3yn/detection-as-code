title: wevtutil ilə hadisə jurnallarının silinməsi
id: f328266f-6771-4b1b-9a4b-72213e18f189
status: test
description: wevtutil.exe-nin cl və ya clear-log parametri ilə Windows hadisə jurnallarını silməsini aşkarlayır.
author: Miri
date: '2026-10-26'
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\wevtutil.exe'
  selection_cli:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  condition: selection_img and selection_cli
falsepositives:
  - Administratorların planlı jurnal təmizləməsi
level: high