title: LSASS yaddaşının dump edilməsi
id: f094c815-50f4-43e6-8473-a22e16725999
status: test
description: LSASS prosesinin yaddaşının procdump və ya comsvcs.dll MiniDump ilə fayla yazılmasını aşkarlayır.
author: Miri
date: '2026-10-28'
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_procdump_img:
    Image|endswith:
      - '\procdump.exe'
      - '\PROCDUMP.EXE'
      - '\procdump64.exe'
      - '\PROCDUMP64.EXE'
  selection_procdump_cli:
    CommandLine|contains:
      - 'lsass'
      - 'LSASS'
  selection_comsvcs_img:
    Image|endswith:
      - '\rundll32.exe'
      - '\RUNDLL32.EXE'
  selection_comsvcs_cli_a:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  selection_comsvcs_cli_b:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'minidump'
  selection_comsvcs_cli_c:
    CommandLine|contains|all:
      - 'COMSVCS'
      - 'MINIDUMP'
  condition: (selection_procdump_img and selection_procdump_cli) or (selection_comsvcs_img and (selection_comsvcs_cli_a or selection_comsvcs_cli_b or selection_comsvcs_cli_c))
falsepositives:
  - Sysinternals ilə legitim diaqnostika və çökmə analizi
level: high