name: PR yoxlaması
on: pull_request
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 1. Sigma sintaksisi
        run: sigma check rules/
      - name: 2. Metadata, ID, test faylları
        run: python scripts/validate.py
      - name: 3. Çevrilə bilmə
        run: python scripts/convert.py
      - name: 4. Testlər
        run: python scripts/run_tests.py
        env:
          ES_URL: http://localhost:9200
      - name: 5. Hesabat
        run: python scripts/report.py
      - name: Test nəticəsini saxla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results.json
          if-no-files-found: ignore
      - name: Hesabatı saxla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore